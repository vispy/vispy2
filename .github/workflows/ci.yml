name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: vispy/gsp
          path: _gsp
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation tools and producer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy>=1.15,<3" "pytest>=8,<10" "ruff==0.16.1" "uv>=0.7,<1"
          python -m pip install -e _gsp/packages/gsp-core -e _gsp/packages/gsp-matplotlib -e .
      - name: Test
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy src --strict --show-error-codes
      - name: Lint
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
      - name: Build wheels
        run: |
          mkdir -p "$RUNNER_TEMP/vispy2-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/vispy2-dist" _gsp/packages/gsp-core
          uv build --wheel --out-dir "$RUNNER_TEMP/vispy2-dist" _gsp/packages/gsp-matplotlib
          uv build --wheel --out-dir "$RUNNER_TEMP/vispy2-dist" .
      - name: Test installed wheels
        run: |
          python -m venv "$RUNNER_TEMP/vispy2-producer-wheel-venv"
          "$RUNNER_TEMP/vispy2-producer-wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/vispy2-dist/gsp_core-*.whl \
            "$RUNNER_TEMP"/vispy2-dist/vispy2-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vispy2-producer-wheel-venv/bin/python" - <<'PY'
          import importlib.util
          from pathlib import Path
          import sysconfig

          import gsp
          import vispy2

          wheel_site = Path(sysconfig.get_path("purelib")).resolve()
          for module in (gsp, vispy2):
              module_path = Path(module.__file__).resolve()
              assert module_path.is_relative_to(wheel_site), (module.__name__, module_path)
          for adapter in ("gsp_matplotlib", "gsp_datoviz"):
              assert importlib.util.find_spec(adapter) is None, adapter
          PY
          python -m venv "$RUNNER_TEMP/vispy2-wheel-venv"
          "$RUNNER_TEMP/vispy2-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/vispy2-dist/*.whl "pytest>=8,<10"
          "$RUNNER_TEMP/vispy2-wheel-venv/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests"
          "$RUNNER_TEMP/vispy2-wheel-venv/bin/python" "$GITHUB_WORKSPACE/examples/semantic_scene.py"
